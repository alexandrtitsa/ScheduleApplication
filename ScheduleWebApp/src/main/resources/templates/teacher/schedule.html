<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Schedule</title>
<style>
table {
	width: 100%;
	border-collapse: collapse;
	margin-top: 20px;
}

th, td {
	border: 1px solid #c4c6ca;
	padding: 10px;
	text-align: left;
}

th {
	background-color: #f2f2f2;
}
</style>
</head>
<body>
	<div class="container">
		<div class="menu">
			<a href="/login">Logout</a>
		</div>
		<div id="content">
			<h1>Teacher Schedule</h1>
			<table>
				<thead>
					<tr>
						<th>Date</th>
						<th>Time Slot</th>
						<th>Room</th>
						<th>Course</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="schedule : ${schedules}">
						<td th:text="${schedule.date}"></td>
						<td th:text="${schedule.timeSlot}"></td>
						<td th:text="${schedule.room}"></td>
						<td><a
							th:href="@{'/teacher/course/' + ${schedule.course.id} + '/groups'}"
							th:text="${schedule.course.courseName}"></a></td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</body>
</html>
