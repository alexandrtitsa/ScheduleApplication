<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User</title>
</head>
<body>
    <h1>Edit User</h1>

    <form action="/admin/edit/{id}" th:action="@{/admin/edit/{id}(id=${user.id})}" method="post">
        <div>
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName" th:value="${user.firstName}" required>
        </div>
        <div>
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" th:value="${user.lastName}" required>
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" th:value="${user.email}" required>
        </div>
        <div>
            <label for="role">Role:</label>
            <input type="text" id="role" name="role" th:value="${user.role}" required>
        </div>
        <button type="submit">Save Changes</button>
    </form>

    <p><a href="/admin/panel">Back to Admin Panel</a></p>
</body>
</html>
