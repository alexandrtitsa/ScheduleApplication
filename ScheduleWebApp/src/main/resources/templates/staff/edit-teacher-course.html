<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Teacher Course</title>
</head>
<body>
	<header>
		<h1>Edit Teacher Course</h1>
		<nav>
			<ul>
				<li><a href="/staff/panel">Back to Panel</a></li>
			</ul>
		</nav>
	</header>

	<main>
		<form action="/staff/teacher-courses/update" method="post">
			<input type="hidden" th:name="${_csrf.parameterName}"
				th:value="${_csrf.token}" /> <input type="hidden" name="teacherId"
				th:value="${teacherCourse.teacher.id}" /> <input type="hidden"
				name="courseId" th:value="${teacherCourse.course.id}" /> <input
				type="hidden" name="groupId" th:value="${teacherCourse.group.id}" />

			<label for="newTeacherId">Teacher:</label> <select id="newTeacherId"
				name="newTeacherId" required>
				<option value="">-- Select a Teacher --</option>
				<option th:each="teacher : ${teachers}" th:value="${teacher.id}"
					th:text="${teacher.firstName + ' ' + teacher.lastName}"></option>
			</select>

			<label for="newGroupId">Group:</label> <select id="newGroupId"
				name="newGroupId" required>
				<option value="">-- Select a Group --</option>
				<option th:each="group : ${groups}" th:value="${group.id}"
					th:text="${group.groupName}"></option>
			</select>

			<button type="submit">Update</button>
		</form>

	</main>
</body>
</html>
