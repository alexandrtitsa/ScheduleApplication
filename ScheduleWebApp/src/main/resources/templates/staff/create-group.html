<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Group</title>
    <script>
        function submitForm(selectElement) {
            selectElement.form.submit();
        }
    </script>
</head>
<body>
    <header>
        <h1>Create New Group</h1>
        <nav>
            <ul>
                <li><a href="/staff/panel">Back to Panel</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <form action="/staff/groups/create" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <label for="groupName">Group Name:</label>
                <input type="text" id="groupName" name="groupName" required>
                <button type="submit">Create Group</button>
            </form>
        </section>

        <section>
            <h2>All Groups</h2>
            <table>
                <thead>
                    <tr>
                        <th>Group Name</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="group : ${groups}">
                        <td th:text="${group.groupName}"></td>
                        <td>
                            <span th:if="${group.groupName != 'Group 1'}">
                                <form action="/staff/groups/delete" method="post" style="display: inline;">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <input type="hidden" name="groupId" th:value="${group.id}" />
                                    <button type="submit">Delete</button>
                                </form>
                            </span>
                            <span th:if="${group.groupName == 'Group 1'}">Default Group</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section>
            <h2>All Students</h2>
            <table>
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                        <th>Group Name</th>
                        <th>Change Group</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="student : ${students}">
                        <td th:text="${student.id}"></td>
                        <td th:text="${student.firstName}"></td>
                        <td th:text="${student.lastName}"></td>
                        <td th:text="${student.email}"></td>
                        <td th:text="${student.group.groupName}"></td>
                        <td>
                            <form action="/staff/students/change-group" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <input type="hidden" name="studentId" th:value="${student.id}" />
                                <select name="groupId" onchange="submitForm(this)">
                                    <option th:each="group : ${groups}" th:value="${group.id}" th:text="${group.groupName}"></option>
                                </select>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
