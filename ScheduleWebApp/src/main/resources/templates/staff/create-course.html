<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create New Course</title>
</head>
<body>
	<header>
		<h1>Create New Course</h1>
		<nav>
			<ul>
				<li><a href="/staff/panel">Back to Panel</a></li>
			</ul>
		</nav>
	</header>

	<main>
		<form action="/staff/courses/create" method="post">
			<input type="hidden" th:name="${_csrf.parameterName}"
				th:value="${_csrf.token}" />

			<!-- Поле для введення назви курсу -->
			<label for="courseName">Course Name:</label> <input type="text"
				id="courseName" name="courseName" required>

			<!-- Поле для введення опису курсу -->
			<label for="description">Description:</label>
			<textarea id="description" name="description" required></textarea>

			<button type="submit">Create Course</button>
		</form>
	</main>
</body>
</html>
